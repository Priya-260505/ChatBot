<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot</title>
<style>
  :root{
    --bg: #F2EFE9;
    --header: #2F4858;
    --header-text: #F2EFE9;
    --bot-bubble: #E4EEEC;
    --bot-text: #1F3A3D;
    --user-bubble: #33776E;
    --user-text: #FFFFFF;
    --accent: #E07A5F;
    --border: #D8D3C8;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 20px;
  }
  .chat-app{
    width:100%;
    max-width: 420px;
    background:#fff;
    border-radius: 16px;
    overflow:hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    display:flex;
    flex-direction:column;
    height: 620px;
  }
  .chat-header{
    background: var(--header);
    color: var(--header-text);
    padding: 16px 20px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .chat-header .dot{
    width:10px;height:10px;border-radius:50%;
    background: #6FCF97;
  }
  .chat-header h1{
    font-size:16px;
    margin:0;
    font-weight:600;
  }
  .chat-header p{
    margin:0;
    font-size:12px;
    opacity:0.75;
  }
  .messages{
    flex:1;
    padding: 18px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    background: var(--bg);
  }
  .msg{
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height:1.4;
    animation: pop 0.15s ease-out;
    white-space: pre-line;
  }
  @keyframes pop{
    from{ transform: scale(0.95); opacity:0; }
    to{ transform: scale(1); opacity:1; }
  }
  .bot{
    align-self:flex-start;
    background: var(--bot-bubble);
    color: var(--bot-text);
    border-bottom-left-radius: 4px;
  }
  .user{
    align-self:flex-end;
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .input-row{
    display:flex;
    padding: 14px;
    gap:10px;
    border-top: 1px solid var(--border);
    background:#fff;
  }
  .input-row input{
    flex:1;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    font-size:14px;
    outline:none;
  }
  .input-row input:focus{
    border-color: var(--user-bubble);
  }
  .input-row button{
    background: var(--accent);
    color:#fff;
    border:none;
    border-radius: 20px;
    padding: 0 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition: opacity 0.15s;
  }
  .input-row button:hover{
    opacity:0.9;
  }
  .messages::-webkit-scrollbar{ width:6px; }
  .messages::-webkit-scrollbar-thumb{ background: var(--border); border-radius:3px; }
</style>
</head>
<body>

<div class="chat-app">
  <div class="chat-header">
    <div class="dot"></div>
    <div>
      <h1>Buddy</h1>
      <p>Always online</p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">Hi! I'm Buddy 👋 What's your name?</div>
  </div>

  <div class="input-row">
    <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  // ---------- Name memory ----------
  function getUserName(){
    return localStorage.getItem('buddy_user_name');
  }
  function setUserName(name){
    localStorage.setItem('buddy_user_name', name);
  }

  // ---------- Conversation state (tracks movie flow steps) ----------
  let conversationState = null; // null, 'awaiting_language', 'awaiting_movie'

  const tamilMovies = ["Vikram", "Master", "Soorarai Pottru", "96", "Jailer"];
  const englishMovies = ["Inception", "The Shawshank Redemption", "Interstellar", "The Dark Knight", "Forrest Gump"];

  // ---------- Simple friendly rules ----------
  const rules = [
    { keys: ['how are you'], reply: "I'm doing great, thanks for asking! 😊 How about you?" },
    { keys: ['what are you doing'], reply: "Just here, chatting with you! 💬 What's up?" },
    { keys: ['who are you'], reply: "I'm Buddy 🤖 — a friendly chatbot here to chat and help out!" },
    { keys: ['joke'], reply: "Why don't scientists trust atoms? Because they make up everything! 😄" },
    { keys: ['help'], reply: "You can ask me about myself, technology, colors, or even ask for a movie suggestion! 🙂" },
    { keys: ['thank'], reply: "You're very welcome! 😊" },
    { keys: ['bye', 'goodbye'], reply: "Goodbye! Have a wonderful day ahead! 👋" },
    { keys: ['weather'], reply: "I can't check live weather, but I hope it's sunny where you are! ☀️" },
    { keys: ['love'], reply: "Aww, that's sweet! I appreciate you too. 💛" },
    { keys: ['good morning'], reply: "Good morning! ☀️ Hope you have an amazing day ahead!" },
    { keys: ['good night'], reply: "Good night! 🌙 Sleep well and take care!" },
  ];

  function detectName(text){
    const match = text.match(/my name is ([a-zA-Z]+)/i) || text.match(/i am ([a-zA-Z]+)/i) || text.match(/i'm ([a-zA-Z]+)/i);
    return match ? match[1] : null;
  }

  async function getBotReply(text){
    const lower = text.toLowerCase();
    const name = getUserName();

    // ----- STEP A: If we are waiting for language choice -----
    if(conversationState === 'awaiting_language'){
      if(lower.includes('tamil')){
        conversationState = 'awaiting_movie';
        return `Great choice! 🎬 Here are 5 Tamil movies:\n\n${tamilMovies.map((m,i)=>`${i+1}. ${m}`).join('\n')}\n\nWhich one would you like to know the story of?`;
      }
      if(lower.includes('english')){
        conversationState = 'awaiting_movie';
        return `Great choice! 🎬 Here are 5 English movies:\n\n${englishMovies.map((m,i)=>`${i+1}. ${m}`).join('\n')}\n\nWhich one would you like to know the story of?`;
      }
      return "Please choose either 'Tamil' or 'English' 😊";
    }

    // ----- STEP B: If we are waiting for movie name -----
    if(conversationState === 'awaiting_movie'){
      const allMovies = [...tamilMovies, ...englishMovies];
      const matchedMovie = allMovies.find(m => lower.includes(m.toLowerCase()));

      if(matchedMovie){
        conversationState = null; // reset conversation
        try {
          const res = await fetch('https://chatbot-backend-ym7r.onrender.com/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: `Tell me the story of ${matchedMovie}` })
          });
          const data = await res.json();
          return `${data.answer || "I couldn't find the story right now."}\n\nWant to know about another movie? 🎬`;
        } catch (err) {
          return "Something went wrong fetching the story, please try again. 😕";
        }
      }
      return "I couldn't recognize that movie name, please pick one from the list above 🎬";
    }

    // ----- STEP C: Detect "suggest me a movie" type requests -----
    if(lower.includes('movie')){
      conversationState = 'awaiting_language';
      return "Sure! 🎬 Would you like Tamil or English movie suggestions?";
    }

    // ----- STEP D: Name detection -----
    const detectedName = detectName(text);
    if(detectedName){
      setUserName(detectedName);
      return `Nice to meet you, ${detectedName}! Do you need any other help? 😊`;
    }

    // ----- STEP E: Greetings -----
    if(['hi', 'hello', 'hey'].some(k => lower.includes(k))){
      return name ? `Hey ${name}! 👋 How's it going?` : "Hey there! 👋 How's it going? (By the way, what's your name?)";
    }

    // ----- STEP F: Simple rules -----
    for(const rule of rules){
      if(rule.keys.some(k => lower.includes(k))){
        return rule.reply;
      }
    }

    // ----- STEP G: Fall back to RAG backend -----
    try {
      const res = await fetch('https://chatbot-backend-ym7r.onrender.com/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: text })
      });
      const data = await res.json();
      let answer = data.answer || "Hmm, I couldn't find anything about that. 🤔";
      if(name) answer = `${name}, ${answer.charAt(0).toLowerCase() + answer.slice(1)}`;
      answer += "\n\nWant to know anything else? 😊";
      return answer;
    } catch (err) {
      return "Something went wrong, please try again. 😕";
    }
  }

  function addMessage(text, sender){
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function handleSend(){
    const text = inputEl.value.trim();
    if(!text) return;
    addMessage(text, 'user');
    inputEl.value = '';

    fetch('https://chatbot-backend-ym7r.onrender.com/api/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sender: 'user', text })
    });

    const botReply = await getBotReply(text);
    addMessage(botReply, 'bot');

    fetch('https://chatbot-backend-ym7r.onrender.com/api/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sender: 'bot', text: botReply })
    });
  }

  sendBtn.addEventListener('click', handleSend);
  inputEl.addEventListener('keydown', e => {
    if(e.key === 'Enter') handleSend();
  });
</script>

</body>
</html>
